name: CI

on:
  push:
    branches: [production-stable, develop-modern]
  pull_request:
    branches: [production-stable]
  workflow_dispatch:

jobs:
  client:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint --if-present

      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'   # CRA treats warnings as errors in CI by default; v1 has some
        run: yarn build

  server:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Smoke import all modules
        run: |
          node --experimental-vm-modules -e "
            import('./server.js').catch(e => {
              console.error('Server failed to load:', e.message);
              process.exit(1);
            });
          " &
          PID=$!
          sleep 5
          kill $PID 2>/dev/null || true
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          APP_SECRET: ci-test-secret
          NODE_ENV: development